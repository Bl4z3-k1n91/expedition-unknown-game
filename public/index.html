<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Blitz! — play together</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css" /></head>
<body class="landing"><header class="topbar"><a class="logo" href="/">blitz<span>!</span></a><a class="host-link" href="/host.html">Host a game →</a></header><main class="join-stage"><div class="squiggle s1"></div><div class="squiggle s2"></div><section class="join-card"><p class="kicker">LIVE TRIVIA, ZERO AWKWARDNESS</p><h1>Get in.<br><i>Get loud.</i></h1><p class="sub">Type the game PIN from the big screen and bring your fastest brain.</p><form id="join-form"><label for="room">GAME PIN</label><input id="room" name="room" inputmode="numeric" maxlength="16" placeholder="123 456" required><label for="player">YOUR NICKNAME</label><input id="player" name="player" maxlength="20" placeholder="e.g. quiz_wizard" required><button type="submit">LET'S GO <b>→</b></button></form><p id="message" class="message" aria-live="polite">Your room is waiting.</p></section><aside class="poster" aria-label="Game preview"><div class="poster-top">TONIGHT'S ROOM</div><strong>FRIDAY<br>FRENZY</strong><div class="poster-bottom"><span>12 QUESTIONS</span><span>⚡ FAST WINS</span></div></aside></main><footer><span>● LIVE ROOMS</span><span>PLAY WITH YOUR PEOPLE</span><span>NO DOWNLOADS</span></footer><script src="/app.js"></script></body></html>
